<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central heating dashboard browser checks</title>
<style>
  :root{--primary-text-color:#172331;--secondary-text-color:#546473;--card-background-color:#fff;--secondary-background-color:#f0f4f7;--divider-color:#d3dce3;--primary-color:#176ba0;--text-primary-color:#fff}
  body{margin:0;background:#e8eef2;font-family:Arial,sans-serif}
  #fixture-surface{display:block;width:100vw;min-width:0}
</style>
<script type="module" src="../custom_components/central_heating/www/central-heating-card.js"></script>
<!-- Duplicate evaluation exercises cached/updated resources without global collisions. -->
<script type="module" src="../custom_components/central_heating/www/central-heating-card.js?v=second-load"></script>
<body><main id="fixture-surface"></main><script type="module">
(async () => {
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const now = Date.now() / 1000;
  const room = {
    key:"bedroom",entity_id:"climate.bedroom",name:"Bedroom <test>",zone_ids:["upstairs"],
    temperature:21,effective_target:22,custom_target:22,target_source:"Central",override:false,
    override_duration:"2 hours",override_expires_at:null,medium_at_or_below:20.5,low_at_or_above:21.5,
    reported_mode:"off",reported_fan:"low",confirmed:true,reason:"Waiting for warm water",
    configuration_url:"/config/devices/device/thermostat-one",controls:{override:"switch.bedroom_override"},
  };
  const model = {
    mode:"Adaptive",settings:{target:22,water_on:33,water_off:30,room_maximum:24,room_hysteresis:.5},
    controls:{mode:"select.heating_mode",target:"number.target",water_on:"number.on",water_off:"number.off",room_maximum:"number.maximum",room_hysteresis:"number.gap"},
    rooms:[room],running_fans:0,
    zones:[{id:"upstairs",name:"Poddasze",label:"heating_poddasze",water_temperature:22,raw_temperature:22,allowed:false,sensor_status:"Waiting for warm water",raw_reported_at:now,accepted_reported_at:now,configuration_url:"/config/devices/device/shelly-one"},
      {id:"downstairs",name:"Piwnica",label:"heating_piwnica",water_temperature:22,raw_temperature:22,allowed:false,sensor_status:"Waiting for warm water",configuration_url:"/config/devices/device/shelly-two"}],
  };
  const calls = [];
  const card = document.createElement("central-heating-card");
  card.setConfig({entity:"sensor.heating"});
  card.hass = {states:{}};
  assert(card.shadowRoot.textContent.includes("uruchamia się"),"Missing startup entities show a Polish placeholder");
  const hass = {states:{"sensor.heating":{attributes:model}},callService:async (domain, service, data) => {
    calls.push({domain,service,data});
    if (service === "set_room_override") {
      Object.assign(room,{override:true,effective_target:data.target,custom_target:data.target,target_source:"Temporary",override_duration:data.duration,override_expires_at:Date.now()/1000+1800});
    } else if (domain === "switch") {
      Object.assign(room,{override:false,effective_target:22,target_source:"Central",override_expires_at:null});
    } else if (domain === "number") model.settings.target = data.value;
    else if (service === "set_global_override") Object.assign(model.comfort,{manual_target:data.target,effective_target:data.target,manual_expires_at:Date.now()/1000+data.minutes*60,target_source:"Manual"});
    else if (service === "set_schedule") Object.assign(model.comfort,{schedule:structuredClone(data.entries),schedule_version:model.comfort.schedule_version+1});
    else if (service === "configure_comfort") model.comfort.settings=structuredClone(data.settings);
    else if (service === "discover_comfort") model.comfort.discovery=[{id:"home",name:"Elsnera",rooms:[{id:"room",name:"miGo Living room"}],schedules:[{id:"original",name:"Normal week"}]}];
    card.hass = hass;
  }};
  document.getElementById('fixture-surface').append(card);
  card.hass = hass;
  const find = selector => card.shadowRoot.querySelector(selector);
  const settledSurface = async () => {
    // Shadow-root replacement can transiently expose padding-only geometry.
    // Assert after stable positive layout, never against
    // a detached/stale surface, and retain the independent overflow check.
    const expected = Math.min(innerWidth, 1180);
    assert(expected >= 300, `Browser viewport must be positive (${expected})`);
    for (let attempt = 0; attempt < 30; attempt++) {
      await new Promise(resolve => setTimeout(resolve, 20));
      document.documentElement.getBoundingClientRect(); // flush the complete layout tree
      const current = find('ha-card');
      const width = current.getBoundingClientRect().width;
      const clientWidth = current.clientWidth;
      await new Promise(resolve => setTimeout(resolve, 20));
      if (current.isConnected && current === find('ha-card') && !card._pending && width >= expected * 0.9 && clientWidth >= expected * 0.9 && Math.abs(current.getBoundingClientRect().width - width) < 1 && Math.abs(current.clientWidth - clientWidth) < 1) return current;
      await new Promise(resolve => setTimeout(resolve, 25));
    }
    throw new Error(`Card layout did not settle (${find('ha-card').clientWidth}/${expected})`);
  };
  assert(find("h1").textContent === "Ogrzewanie centralne","Polish is the deployment default");
  assert(find('.water').textContent.includes("Wygładzona temperatura wody"),"Polish describes temperature smoothing");
  assert(find('.reason').textContent.includes("Oczekiwanie na ciepłą wodę"),"Decision reasons are translated");
  assert(find('.room-temperature').textContent === "21,0°C","Polish decimal formatting");
  const language = find('[data-language]');
  language.value = 'en';
  language.dispatchEvent(new Event('change'));
  assert(find("h1").textContent === "Central heating","English stays available");
  assert(find('.water').textContent.includes("Smoothed water temperature"),"English describes temperature smoothing");
  const restored = document.createElement("central-heating-card");
  restored.setConfig({entity:"sensor.heating",language:"pl"});
  restored.hass = hass;
  assert(restored.shadowRoot.querySelector("h1").textContent === "Central heating","Language choice survives card reconstruction");
  assert(window.customCards.filter(item => item.type === "central-heating-card").length === 1,"Duplicate loading registers one card");
  assert(find(".room-head h3").textContent === "Bedroom <test>","Room names must be escaped");
  assert(!find('[data-panel="advanced"]').open,"Advanced settings start collapsed");
  for (const link of card.shadowRoot.querySelectorAll(".device-settings")) {
    assert(!link.closest("details").open,"Device settings must stay inside collapsed details");
    assert(link.getAttribute("href").startsWith("/config/devices/device/"),"Direct device settings URL");
  }
  find("[data-add-room]").click();
  assert(find('[data-panel="add-room"]').open,"Add room opens instructions");
  const panel = find('[data-panel="room-bedroom"]');
  panel.open = true;
  const target = find("[data-draft]");
  target.value = "23";
  target.dispatchEvent(new Event("input"));
  const duration = find("[data-duration]");
  duration.value = "30 minutes";
  duration.dispatchEvent(new Event("change"));
  target.focus();
  model.rooms[0].temperature = 21.5;
  card.hass = hass;
  assert(find("[data-draft]") === target && target.value === "23","Typing survives HA updates");
  target.blur();
  await find("[data-apply]").onclick();
  assert(calls.at(-1).domain === "central_heating" && calls.at(-1).data.target === 23 && calls.at(-1).data.duration === "30 minutes","Target and duration apply together");
  assert(find("[data-expires]").textContent.includes("remaining"),"Override countdown is shown");
  await find("[data-cancel]").onclick();
  assert(!find("[data-cancel]") && find(".source").textContent === "Central","Cancellation restores inheritance");
  const central = find('[data-key="target"]');
  await central.closest(".stepper").querySelector('[data-step="0.5"]').onclick();
  // Click handlers may initiate an asynchronous native service.
  await Promise.resolve();
  assert(calls.at(-1).domain === "number" && calls.at(-1).data.value === 22.5,"Central step buttons use half degrees");
  model.zones[0].sensor_issue = "Suspect 85°C sensor reset";
  model.zones[0].raw_temperature = 85;
  model.zones[0].sensor_fault = true;
  card.hass = hass;
  assert(find('[role="alert"]').textContent.includes("85°C"),"Rejected readings are visible");
  const fail = hass.callService;
  hass.callService = async () => { throw new Error("Service failed"); };
  await find('[data-mode="Off"]').onclick();
  assert(find('[role="alert"]').textContent.includes("Service failed"),"Service errors are visible");
  hass.callService = fail;
  assert(card.getBoundingClientRect().width <= innerWidth,"Card fits the viewport");
  const polishLanguage = find('[data-language]');
  polishLanguage.value = 'pl';
  polishLanguage.dispatchEvent(new Event('change'));
  assert([...card.shadowRoot.querySelectorAll('[role="alert"]')].some(element => element.textContent.includes("Podejrzany odczyt 85°C")),"Polish keeps the sensor warning");
  assert(find('[data-duration] option[value="30 minutes"]').textContent === '30 minut',"Duration labels translate without changing service values");
  assert(find('[data-mode="Adaptive"]').textContent === 'Adaptacyjny',"Mode labels translate without changing service values");
  await find('[data-mode="Manual"]').onclick();
  assert(calls.at(-1).data.option === 'Manual',"Polish mode actions preserve HA option values");
  Object.assign(model.zones[0], {backup_active:true,backup_source_name:'Piwnica <test>',operating_water_temperature:34,sensor_issue:'Water sensor unavailable',sensor_fault:true});
  card.hass = hass;
  assert(find('[data-backup-zone="upstairs"]').textContent.includes('Sterowanie czujnikiem zapasowym'),"Prominent Polish backup warning");
  assert(find('[data-backup-zone="upstairs"]').textContent.includes('Piwnica <test>'),"Backup source names are escaped");
  assert(find('.zone .water').textContent.includes('34,0°C'),"Operating temperature uses the backup");
  assert(!find('.zone > .alert.error'),"Backup operation does not claim its fans are stopped");
  const backupLanguage = find('[data-language]');
  backupLanguage.value = 'en';
  backupLanguage.dispatchEvent(new Event('change'));
  assert(find('[data-backup-zone="upstairs"]').textContent.includes('Backup sensor active'),"English backup warning");
  model.mode = 'Manual';
  card.hass = hass;
  assert(!find('[data-backup-zone]'),"Manual mode hides the backup warning");
  model.mode = 'Adaptive';
  Object.assign(model.zones[0], {backup_active:false,sensor_issue:null,sensor_fault:false});
  card.hass = hass;
  assert(!find('[data-backup-zone]'),"Recovery clears the backup warning");
  const surface = await settledSurface();
  assert(surface.scrollWidth <= surface.clientWidth + 1,`Polish controls fit the viewport (${surface.scrollWidth}/${surface.clientWidth})`);
  Object.assign(hass.states,{
    "sensor.ambient":{attributes:{friendly_name:"Bedroom ambient",unit_of_measurement:"°C"}},
    "sensor.migo_alias":{attributes:{friendly_name:"miGo ambient",unit_of_measurement:"°C"}},
    "climate.migo":{attributes:{friendly_name:"miGo thermostat",current_temperature:21}},
  });
  model.comfort={settings:{room_sensors:{"sensor.ambient":1},migo_entity:"climate.migo",home_id:"home",room_id:"room",schedule_id:"original",minimum:18,maximum:24,manual_minutes:60,poll_seconds:60,correction_seconds:600,freshness_seconds:900,coverage:1,smoothing_seconds:60,hysteresis:0.05},
    schedule:[{day:0,time:"00:00",target:22}],schedule_version:1,confirmed_version:1,confirmed_schedule:[{day:0,time:"00:00",target:22}],weighted_temperature:20.7,effective_target:22,target_source:"Schedule",owner:"HA",reference_temperature:22,native_target:22,raw_output:23.3,smoothed_output:23.1,requested_output:22.5,due:false,status:"Waiting for actuator limiter",excluded_entities:["sensor.migo_alias","sensor.upstairs"]};
  card.hass=hass;
  assert(find('[data-weighted]').textContent==='20.7°C',"Home shows weighted room average");
  assert(!find('.main-controls [data-key="target"]'),"Configured whole-home target has no duplicate legacy control");
  assert(find('[data-native-target]').textContent==='Current miGo target: 22.0°C'&&find('[data-next-step]').textContent==='Next miGo step: 22.5°C',"Actual native target is distinct from the next limited step");
  assert(find('[data-calculated-target]').textContent==='Calculated miGo target: 23.3°C',"Full raw calculation stays visible while the actuator limiter waits, distinct from smoothing and the next step");
  assert(find('.comfort-home').textContent.includes('before smoothing and limits'),"Full calculation is not presented as the immediately applied target");
  const correctionLanguage=find('[data-language]');correctionLanguage.value='pl';correctionLanguage.dispatchEvent(new Event('change'));
  assert(find('[data-native-target]').textContent==='Aktualna nastawa miGo: 22,0°C'&&find('[data-calculated-target]').textContent==='Pełna wyliczona nastawa: 23,3°C'&&find('[data-next-step]').textContent==='Następny krok miGo: 22,5°C',"Polish distinguishes current, fully calculated and next-step targets");
  const correctionSurface=await settledSurface();
  assert(correctionSurface.scrollWidth<=correctionSurface.clientWidth+1,"Polish correction values fit desktop and mobile without horizontal scrolling");
  model.comfort.raw_output=25.3;model.comfort.saturated=true;card.hass=hass;
  assert(find('[data-calculated-target]').textContent.includes('25,3°C')&&find('.comfort-status').textContent.includes('Osiągnięto limit korekty'),"An unbounded full calculation retains the visible output-limit warning");
  delete model.comfort.raw_output;delete model.comfort.requested_output;card.hass=hass;
  assert(!find('[data-calculated-target]')&&!find('[data-next-step]')&&find('[data-native-target]'),"Unavailable calculations are omitted without inventing a target");
  Object.assign(model.comfort,{raw_output:23.3,requested_output:22.5,saturated:false});
  const restoreLanguage=find('[data-language]');restoreLanguage.value='en';restoreLanguage.dispatchEvent(new Event('change'));
  assert(find('[data-comfort-action="enable_correction"]').getAttribute('aria-pressed')==='true'&&find('[data-comfort-action="enable_correction"]').classList.contains('primary')&&find('[data-comfort-action="relinquish"]').getAttribute('aria-pressed')==='false',"Confirmed HA ownership highlights only the HA correction button");
  await settledSurface();
  assert(getComputedStyle(find('[data-comfort-action="enable_correction"]')).backgroundColor!==getComputedStyle(find('[data-comfort-action="relinquish"]')).backgroundColor,"Selected ownership has a visibly different button background");
  model.comfort.owner='miGo';card.hass=hass;
  assert(find('[data-comfort-action="relinquish"]').getAttribute('aria-pressed')==='true'&&find('[data-comfort-action="relinquish"]').classList.contains('primary')&&find('[data-comfort-action="enable_correction"]').getAttribute('aria-pressed')==='false',"miGo ownership highlights only the native-control button");
  await find('[data-comfort-action="enable_correction"]').onclick();
  assert(find('[data-comfort-action="enable_correction"]').getAttribute('aria-pressed')==='false',"Service success alone does not optimistically claim HA ownership before a state update");
  model.comfort.owner='Release pending';card.hass=hass;
  assert([...card.shadowRoot.querySelectorAll('[data-comfort-action="enable_correction"],[data-comfort-action="relinquish"]')].every(button=>button.getAttribute('aria-pressed')==='false'&&!button.classList.contains('primary')),"Pending release does not claim either owner is confirmed");
  Object.assign(model.comfort,{owner:'HA',connection_retrying:true,status:'miGo connection unavailable; retrying automatically',native_dhw_prepared:true,native_dhw_active:null,reference_temperature:null,native_target:null,raw_output:null,requested_output:null});card.hass=hass;
  assert(find('[data-comfort-action="enable_correction"]').getAttribute('aria-pressed')==='true'&&find('.comfort-home .comfort-status').classList.contains('retrying')&&find('.comfort-home .comfort-status').textContent.includes('retrying automatically every 60 seconds'),"Outage retains the selected HA button but honestly reports paused automatic reconnection");
  assert(find('[data-native-target]').textContent.includes('Unavailable')&&!find('[data-calculated-target]')&&!find('[data-next-step]'),"Outage does not display cached data as a fresh correction");
  assert(find('[data-schedule-pane]').textContent.includes('DHW selection unavailable')&&!find('[data-schedule-pane]').textContent.includes('DHW copy prepared; inactive'),"Unknown native DHW selection is distinct from a confirmed inactive schedule");
  const retryLanguage=find('[data-language]');retryLanguage.value='pl';retryLanguage.dispatchEvent(new Event('change'));
  assert(find('.comfort-home .comfort-status').textContent.includes('Brak połączenia z miGo; ponawianie automatyczne co 60 sekund')&&find('[data-comfort-action="enable_correction"]').getAttribute('aria-pressed')==='true',"Polish outage status and selected ownership remain clear on desktop and mobile");
  const retrySurface=await settledSurface();assert(retrySurface.scrollWidth<=retrySurface.clientWidth+1,"Outage status and selected controls fit without horizontal scrolling");
  Object.assign(model.comfort,{connection_retrying:false,status:'Waiting for actuator limiter',native_dhw_prepared:false,reference_temperature:22,native_target:22,raw_output:23.3,requested_output:22.5});
  const retryRestoreLanguage=find('[data-language]');retryRestoreLanguage.value='en';retryRestoreLanguage.dispatchEvent(new Event('change'));
  let globalTarget=find('[data-global-target]'),globalMinutes=find('[data-global-minutes]');
  globalTarget.value='23';globalTarget.dispatchEvent(new Event('input'));globalMinutes.value='90';globalMinutes.dispatchEvent(new Event('input'));
  find('[data-tab="schedule"]').click();find('[data-tab="home"]').click();
  assert(find('[data-global-target]').value==='23'&&find('[data-global-minutes]').value==='90',"Global draft survives tab changes");
  await find('[data-global-apply]').onclick();
  assert(calls.at(-1).service==='set_global_override'&&calls.at(-1).data.minutes===90,"Global target and duration apply together");
  find('[data-tab="schedule"]').click();
  model.comfort.native_dhw_prepared=true;model.comfort.native_dhw_active=false;card.hass=hass;
  assert(find('[data-schedule-pane]').textContent.includes('DHW copy prepared; inactive'),"Prepared DHW copy is not reported as active");
  model.comfort.native_dhw_active=true;card.hass=hass;
  assert(find('[data-schedule-pane]').textContent.includes('DHW available 24/7'),"Active DHW availability is visible");
  assert(find('[data-schedule-pane]').textContent.includes('Saving activates the HA schedule'),"Save activation is explained");
  let scheduleTarget=find('[data-schedule-target]');scheduleTarget.value='22.5';scheduleTarget.dispatchEvent(new Event('input'));
  find('[data-copy-days]').value='all';find('[data-schedule-copy]').click();
  find('[data-day="1"]').click();assert(find('[data-schedule-target]').value==='22.5',"Copy day populates Tuesday");
  find('[data-tab="settings"]').click();find('[data-tab="schedule"]').click();
  assert(find('[data-schedule-target]').value==='22.5',"Schedule draft survives tab changes");
  await find('[data-schedule-save]').onclick();
  assert(calls.at(-1).service==='set_schedule'&&calls.at(-1).data.entries.length===7&&calls.at(-1).data.entries.every(row=>row.target===22.5),"Schedule service receives real weekly desired values");
  assert(find('[data-schedule-pane]').textContent.includes('Pending'),"Unconfirmed native sync remains visibly pending");
  find('[data-tab="settings"]').click();
  assert(card.shadowRoot.querySelectorAll('[data-ambient-index]').length===6,"Six weighted ambient sensor selectors");
  assert(!find('[data-ambient-entity] option[value="sensor.migo_alias"]'),"miGo ambient aliases excluded from selectable average");
  assert(find('[data-comfort-field="correction_seconds"]').min==='60',"UI allows correction intervals shorter than ten minutes");
  const interval=find('[data-comfort-field="correction_seconds"]');interval.value='59';
  assert(!interval.checkValidity(),"UI rejects correction intervals below one minute");
  interval.value='180';interval.dispatchEvent(new Event('input'));
  assert(interval.checkValidity(),"UI accepts a three-minute correction interval");
  await find('[data-native-discover]').onclick();
  assert(find('[data-comfort-field="home_id"] option[value="home"]').textContent==='Elsnera',"Native IDs can be selected by readable names");
  const weight=find('[data-ambient-weight]');weight.value='2';weight.dispatchEvent(new Event('input'));
  find('[data-tab="home"]').click();find('[data-tab="settings"]').click();
  assert(find('[data-ambient-weight]').value==='2',"Weight draft survives tabs");
  await find('[data-comfort-save]').onclick();
  assert(calls.at(-1).service==='configure_comfort'&&calls.at(-1).data.settings.room_sensors['sensor.ambient']===2,"Sensor weights save atomically");
  assert(calls.at(-1).data.settings.correction_seconds===180,"Short correction interval saves in seconds with the other settings");
  assert(find('[data-comfort-field="correction_seconds"]').value==='180',"Saved short correction interval is retained");
  assert(find('[data-comfort-settings]').textContent.includes('0.5°C every 180 seconds'),"English help reflects the configured interval");
  find('[data-tab="home"]').click();
  assert(find('.comfort-home .comfort-status').textContent==='Waiting for correction interval (180 s)',"English status uses the configured interval instead of ten minutes");
  const intervalLanguage=find('[data-language]');intervalLanguage.value='pl';intervalLanguage.dispatchEvent(new Event('change'));
  assert(find('.comfort-home .comfort-status').textContent==='Oczekiwanie na odstęp korekt (180 s)',"Polish status reflects the configured interval");
  find('[data-tab="settings"]').click();
  assert(find('[data-comfort-settings]').textContent.includes('0,5°C co 180 sekund'),"Polish help reflects the configured interval");
  for(const tab of ['home','schedule','settings']){
    find(`[data-tab="${tab}"]`).click();const panel=await settledSurface();
    assert(panel.scrollWidth<=panel.clientWidth+1,`Comfort ${tab} fits viewport (${panel.scrollWidth}/${panel.clientWidth})`);
  }
  localStorage.removeItem('central-heating-language:sensor.heating');
  document.body.dataset.result = "pass";
  document.body.dataset.checks = "76";
})().catch(error => {
  document.body.dataset.result = "fail";
  document.body.dataset.error = error.message;
});
</script></body>
</html>
